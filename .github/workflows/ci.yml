name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'release-v*'

permissions:
  contents: write              # release + asset upload need a writable GITHUB_TOKEN

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # tags are required for mkversion

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/release-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake --preset debug

      - name: Amalgamate
        run: cmake --build build --target amalgamate

      - name: Extract tag annotation
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BODY=$(git tag -l --format='%(contents)' "$TAG")
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release and upload header
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.tag.outputs.body }}
          prerelease: false
          files: dist/lfg-ctest.h
